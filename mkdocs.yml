site_name: ARCHIVIST Wiki
site_url: https://xikmwiki.rosmontis220.top/
site_description: 档案文明 · Silverfish_0 —— ARG 知识库
repo_url: https://github.com/Rosmontis220/ARCHIVIST-Wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - extra.css

plugins:
  - tags
  - search

nav:
  - 首页: index.md
  - 档案文明:
      - 主题总览: 档案文明/index.md
      - 作品:
          - XIKM HLQA ONYIEN:
              - 系列: 档案文明/作品/xikm-hlqa-onyien/index.md
              - 账号与名字: 档案文明/作品/xikm-hlqa-onyien/账号与名字.md
              - WEST: 档案文明/作品/xikm-hlqa-onyien/WEST.md
              - fragment: 档案文明/作品/xikm-hlqa-onyien/fragment.md
              - ABANDON发布视频: 档案文明/作品/xikm-hlqa-onyien/ABANDON发布.md
          - ABANDON:
              - 作品概览: 档案文明/作品/abandon/index.md
              - 玩法与解谜: 档案文明/作品/abandon/玩法与解谜.md
              - RETAIN与THRESHOLD: 档案文明/作品/abandon/RETAIN与THRESHOLD.md
              - DAT文本: 档案文明/作品/abandon/DAT文本.md