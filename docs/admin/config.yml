backend:
  name: github
  repo: Rosmontis220/ARCHIVIST-Wiki
  branch: main
  base_url: https://xikmauth.rosmontis220.top
  auth_endpoint: /auth

media_folder: docs/media
public_folder: ../media

site_url: https://xikmwiki.rosmontis220.top/

collections:
  - name: entries
    label: 条目
    folder: docs
    create: true
    delete: true
    extension: md
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
